width:2;fill:none}.smallbtn{border:1px solid #ccc;border-radius:9px;background:#fff;padding:8px 10px;font-size:15px}body:has(.editor) .add-meal-floating{display:none!important}.add-meal-floating{position:fixed!important;right:max(16px,calc((100vw - 760px)/2 + 16px));bottom:16px;z-index:1000;box-shadow:0 3px 10px rgba(0,0,0,.16)!important;background:#fff!important;width:50px;height:50px;padding:0!important;display:grid;place-items:center;font-size:27px!important;font-weight:400;line-height:1;border-radius:12px!important}.section{font-size:12px;letter-spacing:.09em;color:#777;margin:20px 0 6px}.meal{touch-action:pan-y;display:flex;gap:10px;align-items:center;min-height:57px;padding:12px 2px;border-bottom:1px solid #ddd;margin-inline:-3px}.meal:has(.move){min-height:57px;padding-block:12px;padding-inline:2px;gap:2px}.move,.check{flex:0 0 32px;width:32px;height:32px}.move{border:0!important;border-radius:0;background:transparent!important;font-size:27px;line-height:1;color:#333;padding:0;display:grid;place-items:center}.meal:has(.move) .move{flex-basis:22px;width:22px;min-width:22px}.check{appearance:none;-webkit-appearance:none;flex:0 0 24px;width:24px;height:24px;border:1.5px solid #777;border-radius:5px;background:#fff;margin:0 4px;cursor:pointer}.check:checked{background:#333;border-color:#333;position:relative}.check:checked:after{content:"✓";display:block;color:#fff;font-size:17px;line-height:21px;text-align:center}.mealbody{min-width:0;flex:1}.mealname{user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:0;border:0;background:transparent;text-align:left;font-size:18px;line-height:1.3;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.tab,.addcat,.iconbtn,.move{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.times{font-size:12px;color:#777;margin-top:3px}.editor{border:1px solid #ccc;border-radius:12px;padding:12px;margin:12px 0;background:#f7f7f7}.editor label{display:block;font-size:14px;margin:8px 0 4px}.editor input[type=text],.editor input[type=number],.editor select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:8px 4px;border:1px solid #ccc;border-radius:9px;background:white}.muted{color:#777;font-size:12px}.ingredients-panel{margin-top:8px}#toggleIngredients{margin-top:8px}.ingredients-input{width:100%;min-height:120px;padding:9px;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit;user-select:text;-webkit-user-select:text}.settings-panel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;margin:8px 0 12px;border:1px solid #ddd;border-radius:10px;background:#f7f7f7}.settings-panel button{border:1px solid #ccc;border-radius:8px;background:white;padding:8px 10px;font-size:14px}.shopmeal{display:flex;align-items:center;gap:10px;padding:8px 2px}.shopmeal input{width:20px;height:20px;flex:0 0 20px}.hidden{display:none!important}.ingredients-input{width:100%;min-height:120px;padding:9px;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit;resize:vertical}.shopmeal{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #ddd;font-size:17px}.shopmeal input{width:22px;height:22px}.shopgroup{font-size:12px;letter-spacing:.09em;color:#777;margin:20px 0 6px}
/* My Rotation: each category label + meal row occupies the same 57px interval
   as one regular meal row, so divider-to-divider spacing matches. */
#list.top-summary .section{margin:8px 0 0;padding-top:8px;border-top:1px solid #ddd;line-height:15px;height:auto;min-height:23px;font-size:12px}
#list.top-summary > .top-controls{border-bottom:0;padding-bottom:10px;margin-bottom:0}
#list.top-summary .section:not(:first-child){margin-top:8px}
#list.top-summary .meal{touch-action:pan-y;display:flex;gap:10px;align-items:center;height:34px;min-height:34px;padding:5px 2px;border-bottom:0;margin-inline:-3px}
#list.top-summary .mealname{display:block;font-size:18px;line-height:1.3;margin:0;padding:0 0 12px}#list.top-summary .top-recipe-wrap > .meal{padding-left:14px!important;margin-left:0!important}
#list.top-summary .top-recipe-wrap:has(.top-recipe-ingredients) > .meal{border-bottom:0}
#list.top-summary .top-recipe-ingredients{border-bottom:0!important}
#list.top-summary .top-ingredient-arrow svg{width:20px;height:20px;display:block;stroke:#555;stroke-width:2;fill:none}
/* When cooking times are shown, keep My Rotation as compact as category rows.
   Scope these changes to timed My Rotation, leaving untimed rows untouched. */
#list.top-summary .meal:has(.times){height:auto;min-height:44px;padding:3px 2px 4px}
#list.top-summary .top-recipe-wrap .meal:has(.top-inline-linked){height:auto!important;min-height:56px!important;padding-top:6px!important;padding-bottom:6px!important;align-items:center}
#list.top-summary .top-recipe-wrap .meal:has(.top-inline-linked) .mealname{padding-bottom:0!important;margin-bottom:0!important}
/* Match the weekday-to-meal spacing for cards with an inline linked recipe. */
#list.top-summary .section:has(+ .top-recipe-wrap .top-inline-linked){padding-bottom:3px!important;padding-top:7px!important;min-height:0!important;}
#list.top-summary .section + .top-recipe-wrap:has(.top-inline-linked) > .meal{padding-top:0!important;padding-bottom:5px!important;min-height:43px!important;}
/* Inline linked recipes stay inside their weekday card, directly beneath the main meal. */
#list.top-summary .meal:has(.top-inline-linked){height:auto;min-height:49px;padding-top:3px;padding-bottom:5px}
#list.top-summary .meal:has(.top-inline-linked) .mealname{padding-bottom:0}
#list.top-summary .top-inline-linked{margin-top:2px!important;line-height:1.25}
#list.top-summary .top-inline-linked button{text-decoration:none!important}

#list.top-summary .meal:has(.times) .mealname{padding-bottom:0}
#list.top-summary .meal:has(.times) .times{margin-top:3px;line-height:1.2}
#list.top-summary:has(.meal .times) .section{padding:5px 12px!important;min-height:0}
.tab, #list .section, .shopgroup, .top-groceries > button { text-transform: uppercase; }
/* Keep the ingredient-import and rotation checkboxes precisely aligned. */
.editor .meal-checkbox-option{display:flex;align-items:center;gap:8px;margin:10px 0 6px;font-size:14px}
.editor .meal-checkbox-option input[type="checkbox"]{width:19px;height:19px;flex:0 0 19px;margin:0}

/* Ingredient entry: compact collapsed control and adjacent import buttons. */
.ingredient-toolrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
.ingredient-toolrow #hideIngredients{margin:0}
.ingredient-tool{width:40px;height:40px;flex:0 0 40px;border:1px solid #ccc;border-radius:9px;background:#fff;color:#333;padding:7px;display:grid;place-items:center}
.ingredient-tool svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ingredientsClosed{margin-top:8px}
#ingredientsClosed #toggleIngredients{margin-top:0}
#ingredientsPanel{margin-top:4px}
#ingredientsPanel #ingredientsLabel{margin-top:6px}
#ingredientsPanel .ingredients-input{display:block}
/* Keep Prep, Total, and Marinate times together even on a narrow phone. */
.time-editor-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.time-editor-grid .time-prep{grid-column:auto}
.time-editor-grid > div{min-width:0}
.time-editor-grid label{font-size:12px;white-space:nowrap}
.time-editor-grid input{min-width:0;width:100%;padding:9px 6px;font-size:16px}
.time-editor-grid input::placeholder{font-size:13px}
.time-keyboard-tools{display:flex;justify-content:flex-end;margin-top:4px}
.time-keyboard-tools button{border:1px solid #ccc;border-radius:7px;background:#fff;color:#444;font-size:12px;padding:3px 10px;min-height:26px}

/* Multiple meal categories share the weekday color, with room for their labels. */
#list.top-summary .meal.multi-category-meal{height:auto!important;min-height:56px!important;padding:7px 2px!important;}
#list.top-summary .meal.multi-category-meal .mealname{padding:0!important;}
#list.top-summary .top-recipe-wrap:has(.multi-category-meal){padding-bottom:2px;}
/* Align meal names in multi-category days with single-category weekdays. */
#list.top-summary .top-recipe-wrap > .meal.multi-category-meal{padding-left:14px!important;padding-right:2px!important;}
/* Short settings sections do not need a separate expand action. */
.settings-flat-group{border:1px solid #ddd;border-radius:10px;background:#f7f7f7;width:100%;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.settings-flat-group>strong{font-size:15px;font-weight:600;}
.settings-flat-content{display:flex;flex-direction:column;gap:9px;}
.meal-plan-menu{margin:0 2px 10px;}
#planSettingsPanel{margin:4px 2px 14px;}
/* Compact, independently collapsible Settings sections. */
.settings-sections{display:flex;flex-direction:column;gap:8px;width:100%;}
.settings-group{border:1px solid #ddd;border-radius:10px;background:#f7f7f7;width:100%;overflow:hidden;}
.settings-group > summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:12px 14px;font-weight:600;font-size:15px;user-select:none;-webkit-user-select:none;}
.settings-group > summary::-webkit-details-marker{display:none;}
.settings-group > summary::marker{content:"";}
.settings-group > summary .settings-chevron{width:24px;height:24px;display:block;flex:0 0 24px;margin-left:auto;stroke:#555;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s ease;}
.settings-group[open] > summary .settings-chevron{transform:rotate(180deg);}
.settings-group-content{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;min-width:0;}
.settings-group-content > .weekday-assignment{flex:0 0 auto;}
.settings-backup-controls{display:flex;flex-wrap:wrap;gap:8px;}


.meal-plan-tabs{display:flex;align-items:stretch;gap:5px;overflow-x:auto;max-width:100%;padding:6px 2px 0;margin:2px 0 12px;border-bottom:1px solid #ccc;scrollbar-width:thin;}
.meal-plan-tab{display:flex;align-items:center;gap:1px;flex:0 0 auto;background:#f1f1f1;border:1px solid #d6d6d6;border-radius:11px 11px 0 0;border-bottom:0;min-height:41px;padding:0 3px;}
.meal-plan-tab.selected{background:#fff;border-color:#c7cdd3;box-shadow:inset 0 2px 0 #a3b4c5;}
.meal-plan-tab.selected .meal-plan-tab-name{font-weight:600;color:#28323b;}
.meal-plan-tab-name{border:0;background:transparent;min-height:39px;padding:6px 8px;font-size:14px;max-width:135px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meal-plan-tab-action{border:0;background:transparent;color:#555;font-size:19px;min-width:26px;min-height:34px;padding:0 3px;}
.meal-plan-add{font-size:27px;border:0;background:transparent;min-width:40px;flex:0 0 40px;}
.settings-footer{position:sticky;bottom:0;z-index:5;background:#f7f7f7;width:100%;display:flex;justify-content:space-around;align-items:center;gap:12px;margin-top:12px;padding:12px 2px 0;border-top:0;}
.settings-footer button{flex:1;border:0!important;background:transparent!important;color:#333;min-height:46px;display:grid;place-items:center;}
.settings-footer button svg{width:28px;height:28px;}
.category-button-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px;width:100%;}
#tabs{display:flex;flex-direction:column;align-items:stretch;gap:0;}
#tabs>.tab-actions{order:0;}#tabs>#settingsPanel{order:1;}#tabs>.category-button-row{order:2;}
#list>.category-button-row{margin:1px 0 12px;}
.category-button-row>.catmenu{width:100%;}
.master-grocery-list{overflow-y:auto;min-height:0;flex:1;padding-right:3px;}
.master-grocery-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #eee;font-size:16px;}
.master-grocery-item input{width:21px;height:21px;margin:1px 0 0;flex:0 0 21px;}

/* The My Rotation/Category switch is a recognizable raised button. */
.tab-actions .view-switch{border:1px solid #b9c7d8!important;background:#edf3fa!important;border-radius:10px!important;box-shadow:0 2px 5px rgba(37,56,85,.27)!important;width:43px;height:41px;padding:5px!important;margin-right:5px;}
.tab-actions .view-switch:active{background:#dbe6f5!important;box-shadow:inset 0 1px 3px #a9bad3!important;}
.meal-plan-grocery{margin:12px 3px 35px;}
.meal-plan-grocery h2{font-size:20px;margin:4px 0 10px;}
 .meal-plan-grocery .master-grocery-list{overflow:visible;max-height:none;}
.master-grocery-plan-filters{display:flex;flex-wrap:wrap;gap:8px 17px;margin:10px 0 14px;padding:12px 0;border-bottom:1px solid #dedede;}
.master-grocery-plan-filters strong{display:block;flex:0 0 100%;font-size:14px;}
.meal-plan-grocery > .top-controls{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:0;border:0;background:transparent;}
.meal-plan-grocery > .top-controls .iconbtn{flex:0 0 36px;}
.master-grocery-plan-filters label{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;}
.master-grocery-plan-filters input{width:19px;height:19px;margin:0;}
.master-grocery-fab svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
/* Two distinct floating view switches. Grocery occupies the usual + button spot. */
body:has(#list.top-summary) .master-grocery-fab{bottom:calc(16px + env(safe-area-inset-bottom,0px));}
body:has(#list.top-summary) .all-meals-fab{bottom:calc(77px + env(safe-area-inset-bottom,0px));}
.all-meals-fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.all-meals-fab.active{color:#315ba8;border-color:#8da3bc;background:#edf3fa!important;}
.master-grocery-fab.active{color:#315ba8;border-color:#8da3bc;background:#edf3fa!important;}

.category-delete-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;align-items:center;justify-content:stretch!important;width:100%!important;}
.category-delete-actions>button{width:100%!important;min-width:0!important;height:52px!important;display:grid!important;place-items:center!important;margin:0!important;border:0!important;background:transparent!important;}
/* Match the minimal upper toolbar: no separate card, border, or shadow. */
#list.top-summary > .top-controls{
 position:static!important;
 transform:none!important;
 width:100%;max-width:none;
 z-index:auto;margin:6px 0 8px!important;
 padding:0!important;
 border:0!important;
 background:transparent!important;
 box-shadow:none!important;
 border-radius:0!important;
 display:flex;flex-wrap:nowrap!important;
 align-items:center;
 justify-content:flex-start!important;gap:2px!important;
 overflow-x:auto;scrollbar-width:none;
}
#list.top-summary > .top-controls::-webkit-scrollbar{display:none}
#list.top-summary > .top-controls > button{flex-shrink:0}
#list.top-summary{padding-bottom:5px;}
.all-meals-overview{margin:10px 2px 90px;}
.all-meals-overview h2{font-size:20px;}
.all-meals-day{border-radius:11px;margin:0 0 12px;overflow:hidden;padding:12px 14px 10px;}
.all-meals-day h3{text-transform:uppercase;font-size:12px;font-weight:500;letter-spacing:.08em;color:#666;margin:0 0 6px;}
.all-meals-entry{border-bottom:1px solid rgba(60,60,60,.12);padding:9px 0;}
.all-meals-entry:last-child{border-bottom:0;}
.all-meals-meal-row{display:flex;gap:10px;align-items:center;min-height:42px;}
.all-meals-plan-label{font-size:13px;color:#59606c;font-weight:550;flex:0 0 77px;overflow-wrap:anywhere;}
.all-meals-meal-content{min-width:0;flex:1;}
.all-meals-meal-content .mealname{font-size:16px;text-align:left;line-height:1.28;}
.all-meals-meal-content .times{margin-top:4px;}
.all-meals-expand{flex:0 0 30px;width:30px;height:36px;border:0;background:transparent;display:grid;place-items:center;color:#555;padding:0;}
.all-meals-expand svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.all-meals-empty{display:flex;gap:10px;align-items:center;color:#777;font-size:14px;}
.all-meals-empty strong{flex:0 0 77px;color:#59606c;font-size:13px;font-weight:550;}
.all-meals-ingredients{padding:5px 3px 4px 86px;}
.all-meals-ingredient{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px;color:#555;}
.all-meals-ingredient input{width:20px;height:20px;flex:0 0 20px;margin:0;}
#list.top-summary .meal-plan-grocery{margin-bottom:95px;}

/* Category view shows one color-coordinated dropdown, never the pinned tabs. */
.category-picker-row{align-items:center;flex-wrap:wrap;gap:8px;margin:9px 0 13px;}
.category-picker{flex:1 1 170px;min-width:0;max-width:100%;height:45px;border:1px solid #b8bec6;border-radius:11px;padding:7px 34px 7px 13px;font:600 17px system-ui,-apple-system,sans-serif;color:#242424;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;}
.category-picker option{font-weight:400;}
.category-picker-row .category-manage{flex:0 0 38px;width:38px;height:40px;}
.category-picker-row .addcat{flex:0 0 36px;margin-left:0;}
.category-picker-row .catmenu{flex:0 0 100%;margin:0 0 4px;}
/* Keep My Rotation pinned buttons in their own view only. */

/* Category management: direct rename/delete actions and compact master view. */
.category-picker-row .category-direct-action{flex:0 0 38px;width:38px;height:42px;}
.top-add-category{font-size:27px!important;line-height:1;font-weight:400;}
/* Larger, easier-to-tap Add Group button beside meal-plan tabs. */
.tab-actions .top-add-group{width:36px!important;min-width:36px;height:36px!important;padding:4px!important;font-size:28px!important;font-weight:400;line-height:1;display:grid;place-items:center;touch-action:manipulation;}
.master-categories{display:flex;flex-direction:column;gap:10px;padding-bottom:80px;}
.master-categories-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.master-categories-heading h2{font-size:19px;font-weight:650;}
.master-expansion-controls{display:flex;align-items:center;gap:4px}.master-add-group{font-size:28px!important;font-weight:400;line-height:1}.master-expansion-controls .iconbtn{width:35px;height:35px;min-width:35px;}
.master-hidden-categories-toggle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:14px 0;padding:13px;border:1px solid #d4d4d4;border-radius:12px;background:#fff;color:#333;font:inherit;cursor:pointer;}
.master-hidden-categories-toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.master-categories-actions{display:flex;gap:5px;flex-wrap:wrap;}
.master-categories-actions button{background:#fff;border:1px solid #d1d1d1;border-radius:8px;font-size:13px;padding:6px 8px;}
.master-category-card{border:1px solid #d8dce1;border-radius:12px;overflow:clip;background:#fff;}

/* Group drags keep the held node attached; expansion state is never changed. */
.master-category-card{touch-action:pan-y pinch-zoom;}
.master-group-drag-active{overflow-anchor:none;}
.master-group-drag-active>.master-category-card{height:var(--group-closed-height);overflow:hidden;flex-shrink:0;}
.master-group-drag-active>.master-category-card>.master-category-header{position:relative;top:auto;}

  if(saved!==text)throw Error('Safety backup verification failed. No recipes changed.');
  return text;
 }finally{db.close()}

   const {meal,day,linkedTo}=entry;if(!allPlans&&masterGroceryExcludedMealKeys.has(groceryMealKey(plan,meal)))continue;
   const context=cookingContext(plan.id,day,entry.cat,meal,linkedTo),identity=cookingOccurrenceKey(context);if(observed.has(identity))continue;observed.add(identity);

function getMasterGroceryItems(){

  const {line,quantity,baseKey}=source,checked=grocerySourceChecked(source);

  const key=states.get(baseKey).size>1?baseKey+'|'+(checked?'checked':'unchecked'):baseKey;
  if(!groceries.has(key))groceries.set(key,{line,recipes:[],checkKeys:[],checkGroups:[],quantity:quantity?{...quantity,lo:0,hi:0}:null,baseKey,contributions:[]});

function getCategoryButtonOrder(){

 // retain their existing manual order. This does not mutate saved category data.
 const assigned=[];
 for(const day of orderedDays())for(const c of getDayCategories(day)){
  if(cats.includes(c)&&!assigned.includes(c))assigned.push(c);
 }

}
function rotatePinnedCategoriesToWeekdayOrder(){

 if(!plan)return;

 for(const day of orderedDays()){
  for(const category of getDayCategories(day)){
   if(pinned.has(category)&&!ordered.includes(category))ordered.push(category);
  }
 }
 // Retain manually pinned categories not associated with a weekday, followed
 // by unpinned categories, in the order they were displayed before.
 const existing=getCategoryButtonOrder();
 const remainder=existing.filter(c=>!ordered.includes(c));

}

function scheduledRecipeHighlights(preview=null){

   for(const entry of getDisplayedWeekdayMealsForPlan(current,usedForLabels)){
    scheduledEntries.push({...entry,planName:plan.name,planId:plan.id});

   }

  }

  }else if(response.action==='save'){

/* Detect when each page-specific header actually reaches its sticky position.
   Page renders replace these elements, so re-evaluate after DOM changes. */
(()=>{
  const selector='#list .rotation-compact-header, #list .meal-plan-grocery .grocery-compact-header, #list .all-meals-overview > h2';
  let queued=false;
  function update(){
    queued=false;
    document.querySelectorAll(selector).forEach(header=>{
      const stickyTop=parseFloat(getComputedStyle(header).top)||0;
      const stuck=window.scrollY>0 && header.getBoundingClientRect().top<=stickyTop+1;
      header.classList.toggle('is-stuck',stuck);
    });
  }
  function schedule(){if(!queued){queued=true;requestAnimationFrame(update)}}
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  const list=document.getElementById('list');
  if(list)new MutationObserver(schedule).observe(list,{childList:true,subtree:true});
  schedule();
})();
