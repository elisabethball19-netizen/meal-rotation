function renderTopGroceries(list){

function openEditor(n){editId=n;renderEditor();placeEditorInline();requestAnimationFrame(()=>{const panel=$('editor').querySelector('.editor');if(panel)panel.scrollIntoView({block:'start',behavior:'smooth'});});}function renderEditor(){let m=meals.find(x=>x.id===editId);if(!m){$('editor').innerHTML='';return}$('editor').innerHTML=`<div class="editor"><label>Meal name</label><input id="name" type="text" value="${esc(m.name)}"><label>Category</label><select id="cat">${cats.map(c=>`<option ${c===m.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="grid"><div><label>Prep time (min)</label><input id="prep" type="number" min="0" value="${esc(m.prep)}"></div><div><label>Total time (min)</label><input id="totaltime" type="number" min="0" value="${esc(m.total!==undefined&&m.total!==''?m.total:(m.prep!==''||m.cook!==''?(Number(m.prep)||0)+(Number(m.cook)||0):''))}"></div></div><label>Recipe URL (optional)</label><input id="url" type="text" placeholder="https://" value="${esc(m.url)}"><button id="toggleIngredients" class="smallbtn" type="button">Show ingredients</button><div id="ingredientsPanel" class="ingredients-panel hidden"><label>Ingredients (one per line; include quantity if known)</label><textarea id="ingredients" class="ingredients-input" placeholder="1 onion\n2 cloves garlic\n1 lb chicken">${esc((m.ingredients||[]).join('\n'))}</textarea></div><label><input id="rotation" type="checkbox" ${m.rotation?'checked':''}> Add to rotation</label><div class="actions"><button id="save">Save</button><button id="delete">Delete</button><button id="cancel">Cancel</button></div></div>`;$('toggleIngredients').onclick=()=>{const panel=$('ingredientsPanel');const opening=panel.classList.contains('hidden');panel.classList.toggle('hidden',!opening);$('toggleIngredients').textContent=opening?'Hide ingredients':'Show ingredients'};$('save').onclick=()=>{snapshot();let oldcat=m.cat,oldrot=m.rotation;m.name=$('name').value.trim()||'Untitled meal';m.cat=$('cat').value;m.pre
