<!DOCTYPE html>

(()=>{let cats=['Soup','Tacos','Over Rice','Meat & Mash','Misc','Easy'],active='Soup',menuCat=null,editId=null,showTimes=false,showTop=false,id=1,history=[],suppressClickUntil=0;let meals=[['Soup','Thai Khao Soi',true],['Soup','Thai Boat Noodle',true],['Soup','Thai Chicken Thukpa',true],['Soup','Cauliflower Potato',false],['Soup','Italian Wedding',false],['Soup','Bun Bo Hue',false],['Soup','Thai Tom Yum',false],['Soup','Taiwanese Beef Noodle',false],['Soup','Filipino chicken tinola',false],['Tacos','Shrimp Tacos',true],['Tacos','Cochinita Pibil',true],['Tacos','Carne Asada',false],['Tacos','Birria',false],['Over Rice','Chicken Curry',true],['Over Rice','Thai Garlic Pork',true],['Over Rice','Teriyaki Chicken',false],['Meat & Mash','Cajun Pan Fried Chicken',true],['Meat & Mash','Honey Mustard Chicken',true],['Meat & Mash','Steak',false],['Misc','Meatloaf',true],['Misc','Garlic Steak Linguini',false],['Easy','Spaghetti',true],['Easy','Tortilla Soup',true],['Easy','French Dip',false]].map(a=>({id:id++,cat:a[0],name:a[1],rotation:a[2],prep:'',cook:'',url:''}));try{const saved=localStorage.getItem('mealRotationDataV1');if(saved){const d=JSON.parse(saved);if(Array.isArray(d.cats)&&Array.isArray(d.meals)){cats=d.cats;meals=d.meals;id=Math.max(0,...meals.map(m=>Number(m.id)||0))+1;active=cats.includes(d.active)?d.active:(cats[0]||'Soup')}}}catch(e){}// Merge recipes from the user's Dinner Plan spreadsheet into saved data without overwriting existing edits.
const spreadsheetMeals = [["Soup", "Korean Yukgaejang", false], ["Soup", "Thai Red Curry Chix", true], ["Soup", "Pinchos De Pollo ala Moi", false], ["Soup", "Easy Thai Shrimp Soup", false], ["Soup", "Coconut shrimp Lentil Soup", false], ["Tacos", "Crispy Fish Tacos", false], ["Tacos", "Al Pastor", false], ["Tacos", "Chicken?", false], ["Meat & Mash", "Korean Chix", true], ["Meat & Mash", "Drummies", true], ["Meat & Mash", "Garlic lime tilapia", false], ["Meat & Mash", "Thai basil chicken", false], ["Meat & Mash", "Vietnamese lemongrass chix", false], ["Meat & Mash", "Malasian chicken rendang", false], ["Meat & Mash", "Thai garlic-pepper chix", false], ["Meat & Mash", "Greek Chicken", false], ["Meat & Mash", "Arroz Con Pollo", false], ["Over Rice", "Spicy Chix Bites", true], ["Over Rice", "Chix & 'Shroom Gravy", true], ["Over Rice", "Tarayaki Chix", true], ["Over Rice", "Crying Tiger", false], ["Easy", "Pernil", true], ["Easy", "Apple Braised Pork", true], ["Easy", "Lentils & Tortillas", false]];
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g,' ');

spreadsheetMeals.forEach(([cat,name,rotation]) => {

try { localStorage.setItem('mealRotationDataV1', JSON.stringify({cats,active,meals})); } catch(e) {}
const $=x=>document.getElementById(x);function persist(){try{localStorage.setItem('mealRotationDataV1',JSON.stringify({cats,active,meals}))}catch(e){}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function snapshot(){history.push(JSON.stringify({cats,active,meals}));if(history.length>30)history.shift()}function time(v){v=Number(v);if(!Number.isFinite(v)||v<0)return '—';if(v<60)return v+'m';let h=Math.floor(v/60),m=v%60;return h+'h'+(m?' '+m+'m':'')}function renderTabs(){let t=$('tabs');t.innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='tab'+(c===active?' active':'');b.textContent=c;let timer,longDone=false;b.onclick=()=>{if(longDone){longDone=false;return}active=c;menuCat=null;editId=null;if(showTop)showTop=false;render()};b.onpointerdown=e=>{longDone=false;timer=setTimeout(()=>{longDone=true;menuCat=c;renderMenu()},500)};['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e,()=>clearTimeout(timer)));b.oncontextmenu=e=>{e.preventDefault();menuCat=c;renderMenu()};t.append(b)});let actions=document.createElement('div');actions.className='tab-actions';let plus=document.createElement('button');plus.className='addcat';plus.textContent='+';plus.onclick=()=>{let n=prompt('New category name');if(n&&n.trim()&&!cats.includes(n.trim())){snapshot();cats.push(n.trim());active=n.trim();render()}};actions.append(plus);let undo=document.createElement('button');undo.id='undo';undo.className='iconbtn';undo.title='Undo';undo.setAttribute('aria-label','Undo');undo.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-2"/></svg>';undo.onclick=()=>{if(!history.length)return;let state=JSON.parse(history.pop());cats=state.cats;active=state.active;meals=state.meals;editId=null;render()};actions.append(undo);let clock=document.createElement('button');clock.id='clock';clock.className='iconbtn'+(showTimes?' active':'');clock.title='Show or hide meal times';clock.setAttribute('aria-label','Toggle meal times');clock.setAttribute('aria-pressed',String(showTimes));clock.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>';clock.onclick=()=>{showTimes=!showTimes;renderList();clock.classList.toggle('active',showTimes);clock.setAttribute('aria-pressed',String(showTimes))};actions.append(clock);let summary=document.createElement('button');summary.id='summary';summary.className='iconbtn'+(showTop?' active':'');summary.title='Show top meal in each category';summary.setAttribute('aria-label','Show top meal in each category');summary.setAttribute('aria-pressed',String(showTop));summary.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/></svg>';summary.onclick=()=>{showTop=!showTop;summary.classList.toggle('active',showTop);summary.setAttribute('aria-pressed',String(showTop));renderList()};actions.append(summary);let settings=document.createElement('button');settings.id='settings';settings.className='iconbtn';settings.title='Settings and backups';settings.setAttribute('aria-label','Settings and backups');settings.setAttribute('aria-expanded','false');settings.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/></svg>';actions.append(settings);let panel=document.createElement('div');panel.id='settingsPanel';panel.className='settings-panel hidden';let exportBtn=document.createElement('button');exportBtn.textContent='Export backup';exportBtn.onclick=()=>{persist();let blob=new Blob([JSON.stringify({version:1,cats,active,meals},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meal-rotation-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};let restoreBtn=document.createElement('button');restoreBtn.textContent='Restore backup';restoreBtn.onclick=()=>{let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.cats)||!Array.isArray(d.meals))throw new Error();snapshot();cats=d.cats;meals=d.meals;active=cats.includes(d.active)?d.active:(cats[0]||'Soup');id=Math.max(0,...meals.map(m=>Number(m.id)||0))+1;editId=null;menuCat=null;render();panel.classList.add('hidden');settings.setAttribute('aria-expanded','false')}catch(e){alert('That backup file could not be read.')}};reader.readAsText(file)};input.click()};let closeSettings=document.createElement('button');closeSettings.textContent='Close';closeSettings.onclick=()=>{panel.classList.add('hidden');settings.setAttribute('aria-expanded','false')};panel.append(exportBtn,restoreBtn,closeSettings);settings.onclick=()=>{let open=panel.classList.contains('hidden');panel.classList.toggle('hidden',!open);settings.classList.toggle('active',open);settings.setAttribute('aria-expanded',String(open))};t.append(actions,panel);t.append(actions)}function renderMenu(){let box=$('catmenu');box.innerHTML='';if(!menuCat||!cats.includes(menuCat)){box.classList.add('hidden');return}box.classList.remove('hidden');function arrow(direction,label){let b=document.createElement('button');b.className='arrow';b.title=label;b.setAttribute('aria-label',label);b.innerHTML=direction<0?'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>':'<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';b.onclick=()=>{let i=cats.indexOf(menuCat),j=i+direction;if(j>=0&&j<cats.length){snapshot();[cats[i],cats[j]]=[cats[j],cats[i]];renderTabs();renderMenu()}};box.append(b)}arrow(-1,'Move category left');arrow(1,'Move category right');[['Rename',()=>{let n=prompt('Rename category',menuCat);if(n&&n.trim()&&!cats.includes(n.trim())){snapshot();let old=menuCat;cats[cats.indexOf(old)]=n.trim();meals.forEach(m=>{if(m.cat===old)m.cat=n.trim()});active=n.trim();menuCat=n.trim();render()}}],['Delete',()=>{if(confirm('Delete category and its meals?')){snapshot();meals=meals.filter(m=>m.cat!==menuCat);cats=cats.filter(c=>c!==menuCat);active=cats[0]||'';menuCat=null;render()}}],['Cancel',()=>{menuCat=null;renderMenu()}]].forEach(([txt,fn])=>{let b=document.createElement('button');b.className='smallbtn';b.textContent=txt;b.onclick=fn;box.append(b)})}function renderList(){persist();let list=$('list');list.classList.toggle('top-summary',showTop);list.innerHTML='';if(showTop){cats.forEach(c=>{let h=document.createElement('div');h.className='section';h.textContent=c;list.append(h);let top=meals.find(m=>m.cat===c&&m.rotation);let row=document.createElement('div');row.className='meal';let body=document.createElement('div');body.className='mealbody';if(top){let name=document.createElement('button');name.className='mealname';name.textContent=top.name;let longPressed=false,pressTimer=null;name.style.userSelect='none';name.style.webkitUserSelect='none';name.style.webkitTouchCallout='none';name.style.touchAction='none';name.addEventListener('selectstart',e=>e.preventDefault());name.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation()});name.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;longPressed=false;clearTimeout(pressTimer);pressTimer=setTimeout(()=>{longPressed=true;suppressClickUntil=Date.now()+900;openEditor(top.id)},500)};name.onpointerup=()=>clearTimeout(pressTimer);name.onpointerleave=()=>clearTimeout(pressTimer);name.onpointercancel=()=>clearTimeout(pressTimer);name.onclick=e=>{if(longPressed||Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();longPressed=false;return}if(top.url){e.preventDefault();window.open(top.url,'_blank','noopener')}};body.append(name);if(showTimes){let t=document.createElement('div');t.className='times';let p=top.prep===''?'—':time(top.prep),co=top.cook===''?'—':time(top.cook),total=(top.prep===''&&top.cook==='')?'—':time((Number(top.prep)||0)+(Number(top.cook)||0));t.textContent=p+' prep · '+co+' cook · '+total+' total';body.append(t)}}else{body.textContent='No meals in rotation'}row.append(body);list.append(row)});return}if(!active)return;[['IN ROTATION',true],['IDEAS',false]].forEach(([title,rot])=>{let h=document.createElement('div');h.className='section';h.textContent=title;list.append(h);meals.filter(m=>m.cat===active&&m.rotation===rot).forEach(m=>{let row=document.createElement('div');row.className='meal';if(rot){let down=document.createElement('button');down.className='move';down.textContent='↓';down.title='Move to bottom';down.onclick=()=>{snapshot();meals.splice(meals.indexOf(m),1);meals.push(m);renderList()};row.append(down)}else{let cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.setAttribute('aria-label','Add to rotation');cb.onchange=()=>{snapshot();let wasInRotation=m.rotation;m.rotation=cb.checked;if(!wasInRotation&&m.rotation){meals.splice(meals.indexOf(m),1);let first=meals.findIndex(x=>x.cat===m.cat&&x.rotation);if(first<0)meals.push(m);else meals.splice(first,0,m)}renderList()};row.append(cb)}let body=document.createElement('div');body.className='mealbody';let name=document.createElement('button');name.className='mealname';name.textContent=m.name;let timer=null,longPressed=false;name.style.userSelect='none';name.style.webkitUserSelect='none';name.style.webkitTouchCallout='none';name.style.touchAction='none';name.addEventListener('selectstart',e=>e.preventDefault());name.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation()});name.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;longPressed=false;clearTimeout(timer);timer=setTimeout(()=>{longPressed=true;suppressClickUntil=Date.now()+900;openEditor(m.id)},500)};name.onpointerup=()=>clearTimeout(timer);name.onpointerleave=()=>clearTimeout(timer);name.onpointercancel=()=>clearTimeout(timer);name.onclick=e=>{if(longPressed||Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();longPressed=false;return}if(m.url){e.preventDefault();window.open(m.url,'_blank','noopener')}};body.append(name);if(showTimes){let t=document.createElement('div');t.className='times';let p=m.prep===''?'—':time(m.prep),total=(m.total!==undefined&&m.total!=='')?time(m.total):((m.prep===''&&m.cook==='')?'—':time((Number(m.prep)||0)+(Number(m.cook)||0)));t.textContent=p+' prep · '+total+' total';body.append(t)}row.append(body);list.append(row)})});let add=document.createElement('button');add.className='smallbtn';add.style.marginTop='12px';add.textContent='+ Add meal';add.onclick=()=>{snapshot();let m={id:id++,cat:active,name:'',rotation:false,prep:'',cook:'',total:'',url:''};meals.push(m);openEditor(m.id)};list.append(add)}function openEditor(n){editId=n;renderEditor();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}function renderEditor(){let m=meals.find(x=>x.id===editId);if(!m){$('editor').innerHTML='';return}let posMeals=meals.filter(x=>x.cat===m.cat&&x.rotation===m.rotation&&x.id!==m.id);$('editor').innerHTML=`<div class="editor"><label>Meal name</label><input id="name" type="text" value="${esc(m.name)}"><label>Category</label><select id="cat">${cats.map(c=>`<option ${c===m.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="grid"><div><label>Prep time (min)</label><input id="prep" type="number" min="0" value="${esc(m.prep)}"></div><div><label>Total time (min)</label><input id="totaltime" type="number" min="0" value="${esc(m.total!==undefined&&m.total!==''?m.total:(m.prep!==''||m.cook!==''?(Number(m.prep)||0)+(Number(m.cook)||0):''))}"></div></div><label>Recipe URL (optional)</label><input id="url" type="text" placeholder="https://" value="${esc(m.url)}"><label><input id="rotation" type="checkbox" ${m.rotation?'checked':''}> Include in rotation</label><label>Position in this section</label><select id="position"><option value="">Select position</option><option value="first">First</option>${posMeals.map(x=>`<option value="before:${x.id}">Before ${esc(x.name||'Untitled meal')}</option>`).join('')}<option value="last">Last</option></select><div class="actions"><button id="save">Save</button><button id="delete">Delete</button><button id="cancel">Cancel</button></div></div>`;$('save').onclick=()=>{snapshot();let oldcat=m.cat,oldrot=m.rotation;m.name=$('name').value.trim()||'Untitled meal';m.cat=$('cat').value;m.prep=$('prep').value;m.total=$('totaltime').value;m.cook='';m.url=$('url').value.trim();m.rotation=$('rotation').checked;let chosen=$('position').value;if(chosen!==''&&oldcat===m.cat&&oldrot===m.rotation){let groupIndexes=[];let groupItems=[];meals.forEach((x,i)=>{if(x.cat===m.cat&&x.rotation===m.rotation&&x.id!==m.id){groupIndexes.push(i);groupItems.push(x)}});let at=groupItems.length;if(chosen==='first')at=0;else if(chosen.startsWith('before:')){let targetId=Number(chosen.slice(7));let targetIndex=groupItems.findIndex(x=>x.id===targetId);if(targetIndex>=0)at=targetIndex}else if(chosen==='last')at=groupItems.length;groupItems.splice(at,0,m);let allIndexes=[];meals.forEach((x,i)=>{if(x.cat===m.cat&&x.rotation===m.rotation)allIndexes.push(i)});if(!allIndexes.includes(meals.findIndex(x=>x.id===m.id)))allIndexes.push(meals.findIndex(x=>x.id===m.id));allIndexes.sort((a,b)=>a-b);allIndexes.forEach((idx,i)=>{meals[idx]=groupItems[i]})}else if(oldcat!==m.cat||oldrot!==m.rotation){meals=meals.filter(x=>x.id!==m.id);let i=meals.findIndex(x=>x.cat===m.cat&&x.rotation===m.rotation);if(i<0)meals.push(m);else meals.splice(i,0,m)}active=m.cat;editId=null;render()};$('cancel').onclick=()=>{editId=null;render()};$('delete').onclick=()=>{if(confirm('Delete this meal?')){snapshot();meals=meals.filter(x=>x.id!==m.id);editId=null;render()}}}function render(){persist();renderTabs();r
