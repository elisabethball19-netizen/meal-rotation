    // OCR can hang for an empty or extremely difficult picture on some phones.
    // Finish with a useful message instead of leaving the progress box open.
    const timedOut=new Promise(resolve=>{
      deadline=setTimeout(()=>resolve({timedOut:true}),60000);
    });
    const result=await Promise.race([
      (async()=>{
        if(await ingredientPhotoIsBlank(file))return {blank:true};
        if(progress.signal.aborted)return {cancelled:true};
        return {text:await recognizeIngredientPhoto(file,progress.signal)};
      })(),
      progress.cancelled,
      timedOut
    ]);
    if(result.timedOut)progress.abort();
    progress.close();
    if(result.cancelled||editId!==m.id||!ingredientField.isConnected)return;
    if(result.timedOut){
      await showAppMessage('The photo could not be read in time. Try a closer photo of the ingredients or enter them manually.');
      return;
    }
    if(result.blank){
      await showAppMessage('No readable ingredients found in that photo. Try a photo containing an ingredient list.');
      return;
    }
    const originalText=String(result.text||'').trim();
    if(!originalText){await showAppMessage('No readable text was found in the photo. Try a clearer picture or enter ingredients manually.');return}
    const extracted=extractPhotoIngredientLines(originalText);
    if(!extracted.lines.length){await showAppMessage('No clear ingredient list was found. Try a close-up photo of just the ingredients, or enter them manually.');return}
    const reviewed=await reviewPhotoIngredients(extracted.lines.join('\n'),originalText);
    if(reviewed!==null&&editId===m.id&&ingredientField.isConnected){mergeIngredientDraft(reviewed.split(/\r?\n/))}
  }catch(e){
    progress.close();
    if(!progress.signal.aborted&&editId===m.id)await showAppMessage('Photo ingredients could not be read. Check your connection or enter them manually.');
  }finally{
    if(deadline!==null)clearTimeout(deadline);
    progress.close();
  }
}

$('save').onclick=async()=>{
  // An uncategorized meal gets a choice before it is saved to Misc.
  if(!editorDraftCategories.length){
    const addCategory=await askAddMealCategory();
    if(addCategory){
      if(!cats.length){const chosen=await appDialog('New category name','','prompt');if(chosen&&chosen.trim()){cats.push(chosen.trim());editorDraftCategories.push(chosen.trim());renderCategoryRows()}}
      $('categoryRows').querySelector('.category-add-dropdown')?.focus();
      return;
    }
    let misc=cats.find(c=>c.toLowerCase()==='misc');
    if(!misc){misc='Misc';cats.push(misc)}
    editorDraftCategories.push(misc);
  }
  const originalIngredients=Array.isArray(m.ingredients)?m.ingredients:[];
  const nextIngredients=draftIngredientLines();

  const contentChanged=($('name').value.trim()||'Untitled meal')!==m.name||$('prep').value!==String(m.prep??'')||$('totaltime').value!==String(m.total!==undefined&&m.total!==''?m.total:(m.prep!==''||m.cook!==''?(Number(m.prep)||0)+(Number(m.cook)||0):''))||$('url').value.trim()!==(m.url||'')||ingredientImportUrl!==(m.ingredientImportUrl||'')||$('rotation').checked!==!!m.rotation||JSON.stringify(nextIngredients)!==JSON.stringify(originalIngredients);
  const priorMembers=categoryMembers();
  const applyAll=priorMembers.length>1&&contentChanged?await askLinkedChange('Save changes to all linked meals?',true):false;
  if(applyAll===null)return;
  snapshot();
  const oldcat=m.cat,oldrot=m.rotation;
  m.name=$('name').value.trim()||'Untitled meal';
  m.cat=editorDraftCategories.includes(oldcat)?oldcat:editorDraftCategories[0];
  m.prep=$('prep').value;m.total=$('totaltime').value;m.cook='';m.url=$('url').value.trim();m.ingredientImportUrl=ingredientImportUrl;
  m.ingredients=nextIngredients;
  m.rotation=$('rotation').checked;
  // Remove deselected category records; reuse unchanged records and create only missing links.
  const others=priorMembers.filter(x=>x.id!==m.id&&editorDraftCategories.includes(x.cat)&&x.cat!==m.cat);
  const chosen=new Set([m.cat,...others.map(x=>x.cat)]);
  meals=meals.filter(x=>!priorMembers.includes(x)||x===m||others.includes(x));
  const linkGroup=editorDraftCategories.length>1?(m.linkGroup||'linked-'+m.id+'-'+Date.now()):'';
  m.linkGroup=linkGroup;
  others.forEach(x=>x.linkGroup=linkGroup);
  for(const cat of editorDraftCategories){
    if(chosen.has(cat))continue;
    const copy={...m,id:id++,cat,linkGroup,ingredients:Array.isArray(m.ingredients)?[...m.ingredients]:[]};
    meals.push(copy);chosen.add(cat);
    try{const key='mealRotationSelectedIngredientsV1';const selections=JSON.parse(localStorage.getItem(key)||'{}');selections[String(copy.id)]=Array.isArray(selections[String(m.id)])?[...selections[String(m.id)]]:[];localStorage.setItem(key,JSON.stringify(selections))}catch(e){}
  }
  if(oldcat!==m.cat||oldrot!==m.rotation){meals=meals.filter(x=>x.id!==m.id);const i=meals.findIndex(x=>x.cat===m.cat&&x.rotation===m.rotation);if(i<0)meals.push(m);else meals.splice(i,0,m)}
  if(linkGroup&&applyAll){const shared={name:m.name,prep:m.prep,cook:m.cook,total:m.total,url:m.url,ingredientImportUrl:m.ingredientImportUrl,rotation:m.rotation,ingredients:Array.isArray(m.ingredients)?[...m.ingredients]:[]};meals.forEach(x=>{if(x.linkGroup===linkGroup&&x.id!==m.id)Object.assign(x,shared,{ingredients:[...shared.ingredients]})})}
  if(!showTop)active=m.cat;
  editorCategoryBaseline=null;editorDraftCategories=null;editId=null;render();
};
$('cancel').onclick=()=>{rollbackEditorCategories();editId=null;render()};$('delete').onclick=async()=>{const linked=m.linkGroup?meals.filter(x=>x.linkGroup===m.linkGroup):[];let all=false;if(linked.length>1){all=await askLinkedChange('Delete all linked meals?',true);if(all===null)return}else if(!await appDialog('Delete this meal?',null,'yesno'))return;snapshot();meals=meals.filter(x=>all?x.linkGroup!==m.linkGroup:x.id!==m.id);if(!all&&linked.length===2){const remaining=meals.find(x=>x.linkGroup===m.linkGroup);if(remaining)remaining.linkGroup=''}editorCategoryBaseline=null;editorDraftCategories=null;editId=null;render()}}function placeEditorInline(){const editor=$('editor');if(showTop){const row=document.querySelector('#list [data-meal-id="'+String(editId)+'"]');const wrap=row&&row.closest('.top-recipe-wrap');if(wrap&&wrap.parentNode){wrap.insertAdjacentElement('afterend',editor)}else if(editor.parentNode!==document.body){document.body.insertBefore(editor,$('list'))}return;}const row=document.querySelector('#list [data-meal-id=\"'+String(editId)+'\"]');if(row&&row.parentNode){row.insertAdjacentElement('afterend',editor)}else if(editor.parentNode!==document.body){document.body.insertBefore(editor,$('list'))}}function render(){persist();renderTabs();renderMenu();renderList();if(editId){renderEditor();placeEditorInline()}else{$('editor').innerHTML='';const e=$('editor');if(e.parentNode!==document.body)document.body.insertBefore(e,$('list'))}}document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,select')){e.preventDefault();e.stopPropagation()}});document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea,select'))e.preventDefault()});document.addEventListener('pointerdown',e=>{if(menuCat&&!$('catmenu').classList.contains('hidden')&&!$('catmenu').contains(e.target)&&!$('tabs').contains(e.target)){menuCat=null;renderMenu()}});render()})();
